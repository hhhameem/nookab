  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
    }

    svg {
      width: 90vw;
      max-width: 1200px;
    }

    svg rect {
      opacity: 1;
    }

    svg path {
      fill: transparent;
      stroke: #FEFEFE;
      stroke-width: 2;
      stroke-dasharray: 3000;
      stroke-dashoffset: 3000;
      animation:
        draw 2.5s ease forwards,
        fillWhite 0.8s ease 2.5s forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fillWhite {
      to {
        fill: #FEFEFE;
      }
    }
  </style>
